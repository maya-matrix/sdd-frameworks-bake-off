[project]
name = "splitit"
version = "0.1.0"
description = "Expense splitting API with exact money arithmetic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.30",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.27",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splitit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
