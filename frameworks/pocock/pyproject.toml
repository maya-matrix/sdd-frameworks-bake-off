[project]
name = "expense-splitter"
version = "0.1.0"
description = "Web API for splitting shared expenses within groups"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
