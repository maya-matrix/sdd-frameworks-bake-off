[project]
name = "expense-splitter"
version = "0.1.0"
description = "Web API for splitting group expenses with exact money arithmetic"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
